[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qexport"
version = "1.2.1"
description = "Bulk exporter for Qiscus Omnichannel: conversations, broadcasts, recipient actions -> one .xlsx"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "tenacity>=9.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "openpyxl==3.1.5",
    "tzdata>=2024.1",
    "typer>=0.12",
    "rich>=13",
    "websocket-client==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
qexport = "qexport.cli:app"

[tool.setuptools.packages.find]
include = ["qexport*"]

[tool.setuptools.package-data]
"qexport.store" = ["schema.sql"]
"qexport.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
